  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20242b; background: #fafaf9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 620px; margin: 96px auto; padding: 0 24px; }
    h1 { margin: 0 0 28px; font-size: 38px; font-weight: 650; letter-spacing: -1.5px; }
    ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid #e2e4e7; }
    li { border-bottom: 1px solid #e2e4e7; }
    a { display: block; padding: 20px 0; color: #244fbe; font-size: 18px; font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
    a:hover { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; border-radius: 2px; }
    @media (max-width: 480px) { main { margin-top: 48px; padding: 0 20px; } h1 { font-size: 32px; } }
  </style>
</head>
